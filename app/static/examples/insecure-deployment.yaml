# Illustrative intentionally misconfigured sample; never deploy this manifest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: training
  template:
    metadata:
      labels:
        app: training
    spec:
      hostNetwork: true
      containers:
      - name: demo
        image: nginx:latest
        securityContext:
          privileged: true
          runAsUser: 0
          allowPrivilegeEscalation: true
        ports:
        - containerPort: 80
